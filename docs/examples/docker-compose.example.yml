# !!!!!!!!!!!!!!
# See https://docs.hyper.lol/guides/cobalt/server/ for a guide!
# !!!!!!!!!!!!!!

services:
  cobalt:
    image: 'ghcr.io/zimpatrick/cobalt:staging'
    read_only: true
    restart: unless-stopped
    container_name: cobalt
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    tmpfs:
      - '/tmp:rw,nosuid,nodev,size=256m'
    pids_limit: 128
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      API_URL: 'https://api.url.example/'
      YOUTUBE_GENERATE_PO_TOKENS: '1'
      YOUTUBE_USE_ONESIE: '1'
    healthcheck:
      test: 'wget -nv --tries=1 --spider http://127.0.0.1:9000 || exit 1'
      interval: 30s
      timeout: 5s
      retries: 2
